<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Muhammad Saqib Aslam</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #131313;
      color: #e5e2e1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      padding: 50px 20px;
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #2e5bff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      color: white;
      border: 3px solid #b8c3ff;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .bio {
      color: #c4c5d9;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .label {
      text-align: left;
      font-size: 12px;
      letter-spacing: 2px;
      color: #b8c3ff;
      margin: 25px 0 12px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 17px 20px;
      margin: 12px 0;
      border: 1px solid #434656;
      border-radius: 12px;
      background: #1c1b1b;
      color: #e5e2e1;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: 0.2s;
    }

    .link:hover {
      background: #2a2a2a;
      border-color: #b8c3ff;
      transform: scale(1.02);
    }

    .featured {
      background: #2e5bff;
      border-color: #2e5bff;
      color: white;
    }

    .featured:hover {
      background: #124af0;
      border-color: #124af0;
    }

    footer {
      margin-top: 40px;
      color: #8e90a2;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="avatar">SA</div>

    <h1>Muhammad Saqib Aslam</h1>

    <p class="bio">
      Welcome to my personal space.  
      Follow me and connect with me on social media.
    </p>

    <div class="label">MY LINKS</div>

    <a class="link featured"
       href="https://www.tiktok.com/@msaqijwnpnh"
       target="_blank">
      🎵 TikTok
    </a>

    <a class="link"
       href="https://pin.it/6Qsbp9Oh1"
       target="_blank">
      📌 Pinterest
    </a>

    <a class="link"
       href="https://www.facebook.com/share/1C9uCiNzMS/"
       target="_blank">
      📘 Facebook
    </a>

    <footer>
      © 2026 Muhammad Saqib Aslam
    </footer>

  </main>

</body>
</html>
